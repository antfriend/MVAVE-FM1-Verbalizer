<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="The Toot Toot Engineering eye: a white eyeball with a red iris">
  <circle cx="50" cy="50" r="40" fill="#fff" stroke="#000" stroke-width="3"/>
  <g>
    <ellipse cx="50" cy="50" rx="20" ry="20" fill="#f00" stroke="#000" stroke-width="1"/>
    <ellipse cx="50" cy="50" rx="10" ry="10" fill="#000" stroke="#000" stroke-width="1"/>
    <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" calcMode="discrete"
      values="0 0; -9 -6; 8 -9; 10 5; -4 10; -11 3; 0 0"/>
  </g>
  <circle cx="42" cy="42" r="9" fill="#fff" fill-opacity="0.8"/>
</svg>
